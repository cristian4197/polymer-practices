<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">

    <title>app-root test</title>

    <script src="../../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
    <script src="../../node_modules/@polymer/test-fixture/test-fixture.js"></script>
    <script src="../../node_modules/mocha/mocha.js"></script>
    <script src="../../node_modules/chai/chai.js"></script>
    <script src="../../node_modules/wct-mocha/wct-mocha.js"></script>

    <script type="module" src="../../src/app-root/app-root.js"></script>
  </head>
  <body>

    <test-fixture id="BasicTestFixture">
      <template>
        <app-root></app-root>
      </template>
    </test-fixture>

    <test-fixture id="ChangedPropertyTestFixture">
      <template>
        <app-root prop1="new-prop1"></app-root>
      </template>
    </test-fixture>

    <script>
      suite('app-root', function() {
  test('instantiating the element with default properties works', function(done) {
    var element = fixture('BasicTestFixture');
    window.requestAnimationFrame(() => {
      assert.equal(element.prop1, 'app-root');
      var elementShadowRoot = element.shadowRoot;
      var elementHeader = elementShadowRoot.querySelector('h2');
      assert.equal(elementHeader.innerHTML, 'Hello app-root!');
      done();
    });
  });
});

    </script>


  </body>
</html>
